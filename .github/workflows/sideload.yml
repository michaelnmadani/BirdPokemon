name: Sideload build

# Builds an unsigned .ipa for sideloading with Sideloadly or AltStore, which
# re-sign it with your own Apple ID (see SIDELOADING.md). No Apple developer
# account or signing secrets needed.
#
# Push a tag like `ios-1.0.0` to publish the .ipa as a GitHub Release (easy to
# download), or run it from the Actions tab to get it as a build artifact.

on:
  push:
    tags: ['ios-*']
  workflow_dispatch:

permissions:
  contents: write   # to publish the Release on tag pushes

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build sideloadable .ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache BirdNET model and TensorFlow Lite
        uses: actions/cache@v4
        with:
          path: |
            models/birdnet
            Vendor
          key: birdnet-ios-${{ hashFiles('scripts/birdnet/*.sh') }}

      - name: Fetch BirdNET model and TensorFlow Lite
        run: |
          scripts/birdnet/fetch-model.sh
          scripts/birdnet/fetch-tflite-ios.sh
          test -d Vendor/TensorFlowLiteC.xcframework

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project DownUnderBirdCollector.xcodeproj \
            -scheme DownUnderBirdCollector \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee build/build.log | grep -E '(: error:|\*\* BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build/build.log

      - name: Package .ipa
        id: ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DownUnderBirdCollector.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "App: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist") $VERSION ($BUILD)"
          echo "Minimum iOS: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          lipo -archs "$APP/DownUnderBirdCollector" | grep -q arm64
          for f in taxonomy_AU.json groups.json BirdNET_GLOBAL_6K_V2.4_Model_FP32.tflite Assets.car; do
            test -e "$APP/$f" || { echo "::error::$f missing from the app"; exit 1; }
          done
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/DownUnderBirdCollector.app
          NAME="DownUnderBirdCollector-$VERSION-$BUILD.ipa"
          (cd build/ipa && zip -qry "../$NAME" Payload)
          shasum -a 256 "build/$NAME" | tee "build/$NAME.sha256"
          ls -lh "build/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION ($BUILD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: build/${{ steps.ipa.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/notes.md <<EOF
          Down Under Bird Collector ${{ steps.ipa.outputs.version }} for sideloading (iOS 17 or later).

          Download **${{ steps.ipa.outputs.name }}** below and install it with Sideloadly or AltStore using your own Apple ID — step-by-step guide: [SIDELOADING.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/SIDELOADING.md).

          SHA-256: \`$(cut -d' ' -f1 "build/${{ steps.ipa.outputs.name }}.sha256")\`
          EOF
          gh release create "$GITHUB_REF_NAME" "build/${{ steps.ipa.outputs.name }}" \
            --title "Down Under Bird Collector ${{ steps.ipa.outputs.version }} (sideload)" \
            --notes-file build/notes.md --prerelease \
          || gh release upload "$GITHUB_REF_NAME" "build/${{ steps.ipa.outputs.name }}" --clobber

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E ': error' build/*.log | sort -u | head -100 || true
