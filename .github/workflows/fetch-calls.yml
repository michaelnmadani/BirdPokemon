name: Fetch species calls

# Picks one Creative Commons recording per species for "Hear its call" and
# commits the updated taxonomy JSON to this branch. Uses xeno-canto when the
# XENO_CANTO_API_KEY secret is set (free key from your xeno-canto account),
# otherwise iNaturalist.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region code'
        required: true
        default: 'AU'
        type: choice
        options: [AU, NZ, GB, US]
      limit:
        description: 'Max species to process (blank = all)'
        required: false
        default: ''
      refresh:
        description: 'Replace existing recordings (e.g. after adding a xeno-canto key)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  fetch-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGION: ${{ inputs.region }}
      LIMIT: ${{ inputs.limit }}
      REFRESH: ${{ inputs.refresh }}
      XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/seed-ebird
        run: npm ci

      - name: Fetch calls
        working-directory: scripts/seed-ebird
        run: |
          ARGS=(--region "$REGION")
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS+=(--limit "$LIMIT"); fi
          if [[ "$REFRESH" == "true" ]]; then ARGS+=(--refresh); fi
          npm run fetch-calls -- "${ARGS[@]}"
          npm run validate -- --region "$REGION"

      - name: Commit updated taxonomy
        run: |
          FILE="DownUnderBirdCollector/Resources/Seeds/taxonomy_${REGION}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No call changes to commit."
          else
            git commit -m "Add bird call recordings for ${REGION} species"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
