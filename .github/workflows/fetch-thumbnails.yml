name: Fetch species photos

# Picks a CC-licensed iNaturalist photo (with photographer credit) for each
# species missing one, and commits the updated taxonomy JSON to this branch.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region code'
        required: true
        default: 'AU'
        type: choice
        options: [AU, NZ, GB, US]
      limit:
        description: 'Max species to process (blank = all)'
        required: false
        default: ''
      refresh_attribution:
        description: 'Also add credits to species that already have a photo'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGION: ${{ inputs.region }}
      LIMIT: ${{ inputs.limit }}
      REFRESH: ${{ inputs.refresh_attribution }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/seed-ebird
        run: npm ci

      - name: Fetch photos
        working-directory: scripts/seed-ebird
        run: |
          ARGS=(--region "$REGION")
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS+=(--limit "$LIMIT"); fi
          if [[ "$REFRESH" == "true" ]]; then ARGS+=(--refresh-attribution); fi
          npm run fetch-thumbnails -- "${ARGS[@]}"
          npm run validate -- --region "$REGION"

      - name: Commit updated taxonomy
        run: |
          FILE="DownUnderBirdCollector/Resources/Seeds/taxonomy_${REGION}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No photo changes to commit."
          else
            git commit -m "Add iNaturalist photos and credits for ${REGION} species"
            git push
          fi
