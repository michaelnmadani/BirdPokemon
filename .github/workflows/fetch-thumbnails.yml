name: Fetch Bird Thumbnails

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region code'
        required: true
        default: 'AU'
        type: choice
        options: [AU, NZ, GB, US]
      limit:
        description: 'Max species to process (leave blank for all 500)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/seed-ebird/package-lock.json

      - name: Install dependencies
        working-directory: scripts/seed-ebird
        run: npm ci

      - name: Fetch thumbnails
        working-directory: scripts/seed-ebird
        run: |
          ARGS="--region ${{ inputs.region }}"
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: npm run fetch-thumbnails -- $ARGS"
          npm run fetch-thumbnails -- $ARGS

      - name: Commit updated taxonomy JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BirdPokemon/Resources/Seeds/taxonomy_${{ inputs.region }}.json
          if git diff --staged --quiet; then
            echo "No thumbnail changes to commit."
          else
            CHANGED=$(git diff --staged --stat | grep 'taxonomy' | head -1)
            git commit -m "Add iNaturalist thumbnails for ${{ inputs.region }} species

$CHANGED

https://claude.ai/code/session_01SJm96kdv8NuPDwvKv1svyE"
            git push
            echo "Pushed updated taxonomy JSON."
          fi
