name: Fetch Bird Thumbnails

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region code'
        required: true
        default: 'AU'
        type: choice
        options: [AU, NZ, GB, US]
      limit:
        description: 'Max species to process (leave blank for all 500)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/seed-ebird
        run: npm install

      - name: Fetch thumbnails
        working-directory: scripts/seed-ebird
        run: |
          REGION="${{ inputs.region }}"
          REGION="${REGION:-AU}"
          ARGS="--region $REGION"
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: npm run fetch-thumbnails -- $ARGS"
          npm run fetch-thumbnails -- $ARGS

      - name: Commit updated taxonomy JSON
        run: |
          REGION="${{ inputs.region }}"
          REGION="${REGION:-AU}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BirdPokemon/Resources/Seeds/taxonomy_${REGION}.json
          if git diff --staged --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "Add iNaturalist thumbnails for ${REGION} species"
            git push
            echo "Pushed updated taxonomy JSON."
          fi
