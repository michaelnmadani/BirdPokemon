name: TestFlight

# Archives a signed Release build and uploads it to App Store Connect, so it
# appears in TestFlight. Run it from the Actions tab. One-time setup is in
# DEPLOYMENT.md (App Store Connect API key + repository secrets).

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in the App Store (e.g. 1.0.0). Blank = value in Config/App.xcconfig'
        required: false
        default: ''

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || secrets.APP_BUNDLE_ID }}
      MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID APP_BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret or variable $name (see DEPLOYMENT.md)"; missing=1; fi
          done
          exit $missing

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Prepare signing config
        run: |
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "APP_BUNDLE_ID = $APP_BUNDLE_ID"
            echo "CURRENT_PROJECT_VERSION = $GITHUB_RUN_NUMBER"
            if [ -n "$MARKETING_VERSION_INPUT" ]; then echo "MARKETING_VERSION = $MARKETING_VERSION_INPUT"; fi
          } > Secrets.xcconfig
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Fetch BirdNET model and TensorFlow Lite
        run: |
          scripts/birdnet/fetch-model.sh
          scripts/birdnet/fetch-tflite-ios.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DownUnderBirdCollector.xcodeproj \
            -scheme DownUnderBirdCollector \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DownUnderBirdCollector.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E '(: error:|\*\* ARCHIVE)'

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DownUnderBirdCollector.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E '(error|Upload|\*\* EXPORT)'
          echo "Build $GITHUB_RUN_NUMBER uploaded. It appears in TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" Secrets.xcconfig

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
