name: DownUnderBirdCollector
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.7.0

targets:
  DownUnderBirdCollector:
    type: application
    platform: iOS
    sources:
      - path: DownUnderBirdCollector
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: DownUnderBirdCollector/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Down Under Bird Collector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Down Under Bird Collector uses the camera to photograph birds you spot."
        NSLocationWhenInUseUsageDescription: "Your location is saved with each sighting, and used to show birds spotted near you."
        EBirdAPIKey: $(EBIRD_API_KEY)
    entitlements:
      path: DownUnderBirdCollector/Supporting/DownUnderBirdCollector.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_NAME: DownUnderBirdCollector
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI

  DownUnderBirdCollectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DownUnderBirdCollectorTests
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - target: DownUnderBirdCollector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DownUnderBirdCollector:
    build:
      targets:
        DownUnderBirdCollector: all
        DownUnderBirdCollectorTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - DownUnderBirdCollector
      targets:
        - DownUnderBirdCollectorTests
    archive:
      config: Release
