name: DownUnderBirdCollector
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.7.0

targets:
  DownUnderBirdCollector:
    type: application
    platform: iOS
    sources:
      - path: DownUnderBirdCollector
        excludes:
          - Resources/Art
      # Watercolours from scripts/artwork/watercolour.py, kept as a folder so the
      # bundle has Art/art_<REGION>.json and Art/<REGION>/<code>.jpg.
      - path: DownUnderBirdCollector/Resources/Art
        type: folder
        buildPhase: resources
      # BirdNET sound ID model — fetched by scripts/birdnet/fetch-model.sh.
      - path: models/birdnet/BirdNET_GLOBAL_6K_V2.4_Model_FP32.tflite
        optional: true
        buildPhase: resources
      - path: models/birdnet/BirdNET_GLOBAL_6K_V2.4_Labels.txt
        optional: true
        buildPhase: resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: DownUnderBirdCollector/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Down Under Bird Collector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Down Under Bird Collector uses the camera to photograph birds you spot."
        NSMicrophoneUsageDescription: "Down Under Bird Collector listens for bird calls only while you're identifying birds by sound. Audio stays on your iPhone and is never recorded."
        NSLocationWhenInUseUsageDescription: "Your location is saved with each sighting, and used to show birds spotted near you."
        EBirdAPIKey: $(EBIRD_API_KEY)
    entitlements:
      path: DownUnderBirdCollector/Supporting/DownUnderBirdCollector.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_NAME: DownUnderBirdCollector
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      # TensorFlow Lite runtime for BirdNET — fetched by scripts/birdnet/fetch-tflite-ios.sh.
      - framework: Vendor/TensorFlowLiteC.xcframework
        embed: false
      - sdk: libc++.tbd

  DownUnderBirdCollectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DownUnderBirdCollectorTests
      # BirdNET's example recording, for the on-device inference test.
      - path: models/birdnet/soundscape.wav
        optional: true
        buildPhase: resources
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - target: DownUnderBirdCollector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DownUnderBirdCollector:
    build:
      targets:
        DownUnderBirdCollector: all
        DownUnderBirdCollectorTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - DownUnderBirdCollector
      targets:
        - DownUnderBirdCollectorTests
    archive:
      config: Release
